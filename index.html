<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller de Reparaciones - Panel de Control</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">

  <!-- Toast / Anuncios de Guardado y Error -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-in-out px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2">
    <i id="toast-icon" class="fas"></i>
    <span id="toast-message"></span>
  </div>

  <!-- Barra Lateral Desktop -->
  <aside class="hidden md:flex flex-col w-64 bg-slate-800 border-r border-slate-700 p-4 space-y-6">
    <div class="flex items-center gap-3 px-2">
      <i class="fas fa-wrench text-blue-500 text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide">ELECTROPARCE</h1>
    </div>
    <nav class="flex-1 space-y-2">
      <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-500 transition">
        <i class="fas fa-chart-line"></i> Panel Principal
      </button>
      <button onclick="switchTab('ordenes')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-slate-300 font-medium transition">
        <i class="fas fa-clipboard-list"></i> Órdenes
      </button>
      <button onclick="switchTab('caja')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-slate-300 font-medium transition">
        <i class="fas fa-cash-register"></i> Caja
      </button>
      <button onclick="switchTab('ajustes')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-slate-300 font-medium transition">
        <i class="fas fa-cog"></i> Ajustes
      </button>
    </nav>
    <div id="user-status-desktop" class="p-3 bg-slate-900 rounded-lg border border-slate-700"></div>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <!-- Header Móvil & Usuario -->
    <header class="flex justify-between items-center pb-4 mb-6 border-b border-slate-800">
      <div class="md:hidden flex items-center gap-2">
        <i class="fas fa-wrench text-blue-500 text-xl"></i>
        <span class="font-bold">ELECTROPARCE</span>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <button id="auth-action-btn" onclick="openAuthModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
      </div>
    </header>

    <!-- Sección: Dashboard -->
    <section id="sec-dashboard" class="space-y-6">
      <h2 class="text-2xl font-bold">Panel de Control</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-slate-400 text-sm">Órdenes Activas</p>
          <p id="stat-ordenes" class="text-3xl font-bold mt-1 text-blue-400">0</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-slate-400 text-sm">Total por Cobrar</p>
          <p id="stat-cobrar" class="text-3xl font-bold mt-1 text-green-400">$0</p>
        </div>
      </div>
    </section>

    <!-- Sección: Ajustes -->
    <section id="sec-ajustes" class="space-y-6 hidden">
      <h2 class="text-2xl font-bold">Ajustes del Taller</h2>
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-xl space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Nombre del Taller</label>
          <input type="text" id="input-shop-name" placeholder="Ej: ElectroParce" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Teléfono de Contacto</label>
          <input type="text" id="input-shop-phone" placeholder="+57 300 000 0000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg font-medium transition flex items-center gap-2">
          <i class="fas fa-save"></i> Guardar Ajustes
        </button>
      </div>
    </section>
  </main>

  <!-- Navegación Inferior (Móvil) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around p-2 z-40">
    <button onclick="switchTab('dashboard')" class="flex flex-col items-center text-blue-400 text-xs">
      <i class="fas fa-chart-line text-lg mb-1"></i> Panel
    </button>
    <button onclick="switchTab('ordenes')" class="flex flex-col items-center text-slate-400 text-xs">
      <i class="fas fa-clipboard-list text-lg mb-1"></i> Órdenes
    </button>
    <button onclick="switchTab('caja')" class="flex flex-col items-center text-slate-400 text-xs">
      <i class="fas fa-cash-register text-lg mb-1"></i> Caja
    </button>
    <button onclick="switchTab('ajustes')" class="flex flex-col items-center text-slate-400 text-xs">
      <i class="fas fa-cog text-lg mb-1"></i> Ajustes
    </button>
  </nav>

  <!-- Modal Autenticación -->
  <div id="auth-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md border border-slate-700 space-y-4 relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <h3 class="text-xl font-bold text-center">Iniciar Sesión</h3>
      
      <div class="space-y-3">
        <input type="email" id="auth-email" placeholder="Correo electrónico" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
        <input type="password" id="auth-password" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
        <button onclick="loginWithEmail()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg font-medium transition">Entrar con Correo</button>
      </div>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-slate-500 text-sm">O</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <button onclick="loginWithGoogle()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 border border-slate-600">
        <i class="fab fa-google text-red-400"></i> Iniciar sesión con Google
      </button>
    </div>
  </div>

  <!-- Firebase JavaScript SDK Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración Firebase con tus credenciales
    const firebaseConfig = {
      apiKey: "AIzaSyBVS68YhSRvIUP5kmh4Ezr44yNqf5G0gUQ",
      authDomain: "proyecto-juan-orosco.firebaseapp.com",
      projectId: "proyecto-juan-orosco",
      storageBucket: "proyecto-juan-orosco.firebasestorage.app",
      messagingSenderId: "775344213720",
      appId: "1:775344213720:web:31e5fd43036634055711ad"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;

    // Control de Estado de Sesión
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const btn = document.getElementById("auth-action-btn");
      const statusDesktop = document.getElementById("user-status-desktop");

      if (user) {
        btn.innerHTML = `<i class="fas fa-sign-out-alt"></i> Salir`;
        btn.onclick = logout;
        statusDesktop.innerHTML = `
          <p class="text-xs text-slate-400">Sesión activa:</p>
          <p class="text-sm font-semibold truncate text-blue-400">${user.email}</p>
        `;
        showToast(`Bienvenido ${user.displayName || user.email}`, "success");
        closeAuthModal();
      } else {
        btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Iniciar Sesión`;
        btn.onclick = openAuthModal;
        statusDesktop.innerHTML = `<p class="text-xs text-amber-400">Modo lectura (No autenticado)</p>`;
      }
    });

    // Login Correo
    window.loginWithEmail = async () => {
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showToast("Error de acceso: " + err.message, "error");
      }
    };

    // Login Google
    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        showToast("Error con Google: " + err.message, "error");
      }
    };

    // Logout
    window.logout = () => {
      signOut(auth);
      showToast("Sesión cerrada", "success");
    };

    // Guardar en Firestore con validación de autenticación
    window.saveSettings = async () => {
      if (!currentUser) {
        showToast("Error: Debes iniciar sesión para realizar cambios", "error");
        openAuthModal();
        return;
      }

      const shopName = document.getElementById("input-shop-name").value;
      const shopPhone = document.getElementById("input-shop-phone").value;

      try {
        await setDoc(doc(db, "configuracion", "general"), {
          nombreTaller: shopName,
          telefono: shopPhone,
          modificadoPor: currentUser.email,
          fecha: new Date().toISOString()
        });
        showToast("Ajustes guardados correctamente", "success");
      } catch (err) {
        showToast("Error al guardar en Firebase: " + err.message, "error");
      }
    };

    // Sistema de Notificaciones (Toast)
    window.showToast = (msg, type = "success") => {
      const toast = document.getElementById("toast");
      const icon = document.getElementById("toast-icon");
      const message = document.getElementById("toast-message");

      message.innerText = msg;
      if (type === "success") {
        toast.className = "fixed top-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2 bg-emerald-600 translate-x-0 transition-transform duration-300";
        icon.className = "fas fa-check-circle";
      } else {
        toast.className = "fixed top-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2 bg-rose-600 translate-x-0 transition-transform duration-300";
        icon.className = "fas fa-exclamation-triangle";
      }

      setTimeout(() => {
        toast.classList.add("translate-x-full");
      }, 3500);
    };

    // UI Routing
    window.switchTab = (tabName) => {
      document.getElementById("sec-dashboard").classList.add("hidden");
      document.getElementById("sec-ajustes").classList.add("hidden");
      
      const target = document.getElementById("sec-" + tabName);
      if (target) target.classList.remove("hidden");
    };

    window.openAuthModal = () => document.getElementById("auth-modal").classList.remove("hidden");
    window.closeAuthModal = () => document.getElementById("auth-modal").classList.add("hidden");
  </script>
</body>
</html>
